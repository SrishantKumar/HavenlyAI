name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'vercel.json'
  release:
    types: [published]

jobs:
  build:
    name: Build & Export Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 6. Install dependencies
        run: npm install

      - name: 7. Prebuild native Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 8. Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 9. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HavenlyAI-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 10. Publish APK to GitHub Release (on release published)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
